<script>
        // Segmented Control Logic
        const typeRoot = document.getElementById('type-selector-root');
        const expenseBtn = document.getElementById('type-expense');
        const incomeBtn = document.getElementById('type-income');

        expenseBtn.addEventListener('click', () => {
            typeRoot.classList.remove('income-active');
            expenseBtn.classList.add('text-primary');
            expenseBtn.classList.remove('text-outline');
            incomeBtn.classList.remove('text-primary');
            incomeBtn.classList.add('text-outline');
        });

        incomeBtn.addEventListener('click', () => {
            typeRoot.classList.add('income-active');
            incomeBtn.classList.add('text-primary');
            incomeBtn.classList.remove('text-outline');
            expenseBtn.classList.remove('text-primary');
            expenseBtn.classList.add('text-outline');
        });

        // Keypad Logic
        const amountDisplay = document.getElementById('amount-display');
        let currentInput = "0.00";

        function appendNumber(num) {
            if (currentInput === "0.00" || currentInput === "0") {
                currentInput = num === "." ? "0." : num;
            } else {
                if (num === "." && currentInput.includes(".")) return;
                currentInput += num;
            }
            updateDisplay();
        }

        function deleteChar() {
            if (currentInput.length <= 1) {
                currentInput = "0";
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = "0";
            updateDisplay();
        }

        function updateDisplay() {
            amountDisplay.innerText = currentInput;
        }

        function setOperator(op) {
            console.log('Operator selected:', op);
        }

        function saveAndAgain() {
            alert('已保存并开始下一笔: ¥' + currentInput);
            clearDisplay();
        }

        function confirmSave() {
            alert('交易已保存: ¥' + currentInput);
        }
    </script>
