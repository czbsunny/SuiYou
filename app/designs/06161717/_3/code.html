<script>
        // Micro-interaction: Change color of Profit inputs based on sign
        const profitInputs = document.querySelectorAll('input[placeholder="0.00"]');
        profitInputs.forEach(input => {
            input.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                if (val > 0) {
                    e.target.classList.remove('text-primary');
                    e.target.classList.add('text-secondary');
                } else if (val < 0) {
                    e.target.classList.remove('text-secondary');
                    e.target.classList.add('text-primary');
                } else {
                    e.target.classList.remove('text-secondary', 'text-primary');
                }
            });
        });
    </script>
