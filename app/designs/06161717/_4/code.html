<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Heritage Hearth - 基金搜索</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#faf9f6",
                    "background": "#faf9f6",
                    "on-primary": "#ffffff",
                    "surface-container-highest": "#e3e2e0",
                    "surface-dim": "#dbdad7",
                    "on-secondary-fixed": "#410007",
                    "on-tertiary-fixed-variant": "#5b4313",
                    "on-error-container": "#93000a",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed": "#271900",
                    "primary-fixed": "#a0f2da",
                    "on-primary-fixed": "#002019",
                    "inverse-on-surface": "#f2f1ee",
                    "on-error": "#ffffff",
                    "primary-fixed-dim": "#84d6be",
                    "on-surface-variant": "#3f4945",
                    "inverse-surface": "#2f312f",
                    "primary": "#006754",
                    "outline-variant": "#bec9c4",
                    "inverse-primary": "#84d6be",
                    "surface-bright": "#faf9f6",
                    "tertiary": "#705624",
                    "error": "#ba1a1a",
                    "secondary": "#b7102a",
                    "on-background": "#1a1c1a",
                    "secondary-fixed": "#ffdad8",
                    "error-container": "#ffdad6",
                    "tertiary-container": "#8b6e3a",
                    "surface-variant": "#e3e2e0",
                    "surface-container-low": "#f4f3f1",
                    "primary-container": "#2a806c",
                    "surface-container-high": "#e9e8e5",
                    "surface-tint": "#066b58",
                    "secondary-fixed-dim": "#ffb3b1",
                    "on-secondary": "#ffffff",
                    "on-surface": "#1a1c1a",
                    "secondary-container": "#db313f",
                    "on-primary-container": "#e7fff5",
                    "outline": "#6f7975",
                    "tertiary-fixed-dim": "#e6c185",
                    "on-secondary-fixed-variant": "#92001c",
                    "tertiary-fixed": "#ffdeaa",
                    "surface-container-lowest": "#ffffff",
                    "surface-container": "#efeeeb",
                    "on-secondary-container": "#fffbff",
                    "on-primary-fixed-variant": "#005142",
                    "on-tertiary-container": "#fff8f2"
            },
            "borderRadius": {
                    "DEFAULT": "0.75rem",
                    "lg": "1.5rem",
                    "xl": "2.25rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "display": ["Plus Jakarta Sans"],
                    "body": ["Plus Jakarta Sans"],
                    "label": ["JetBrains Mono"]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        body {
            background-color: #faf9f6;
            color: #1a1c1a;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .segmented-control-active {
            color: #ffffff;
            background-color: #2a806c;
        }
    </style>
</head>
<body class="font-body selection:bg-primary-fixed antialiased">
<!-- Header: Back button and Search Input -->
<header class="bg-surface sticky top-0 z-50">
<div class="px-4 py-3 flex items-center gap-3">
<button class="p-2 hover:bg-surface-container rounded-full transition-colors active:scale-90 duration-200" onclick="history.back()">
<span class="material-symbols-outlined text-on-surface">arrow_back_ios_new</span>
</button>
<div class="flex-1 relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline pointer-events-none">search</span>
<input autofocus="" class="w-full bg-surface-container-low border-none rounded-full py-3 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant focus:ring-1 focus:ring-primary focus:bg-surface-container transition-all" placeholder="输入基金名称或代码" type="text"/>
</div>
</div>
<!-- Asset Type Switcher (Added below search bar) -->
<div class="px-4 pb-2">
<div class="flex overflow-x-auto hide-scrollbar gap-2 py-2">
<button class="segmented-control-active whitespace-nowrap px-6 py-2 rounded-[12px] text-body-sm font-semibold transition-all">基金</button>
<button class="whitespace-nowrap px-6 py-2 bg-surface-container-low text-on-surface-variant rounded-[12px] text-body-sm font-semibold hover:bg-surface-container transition-all">股票</button>
<button class="whitespace-nowrap px-6 py-2 bg-surface-container-low text-on-surface-variant rounded-[12px] text-body-sm font-semibold hover:bg-surface-container transition-all">港股</button>
<button class="whitespace-nowrap px-6 py-2 bg-surface-container-low text-on-surface-variant rounded-[12px] text-body-sm font-semibold hover:bg-surface-container transition-all">美股</button>
</div>
</div>
</header>
<main class="px-4 pb-24">
<!-- History Section -->
<section class="mt-6">
<div class="flex items-center justify-between mb-4">
<h3 class="text-title-sm font-semibold text-on-surface">历史记录</h3>
<button class="text-label-caps text-outline hover:text-primary transition-colors text-xs">清除</button>
</div>
<div class="flex flex-wrap gap-2">
<span class="px-4 py-2 bg-surface-container-low rounded-[12px] text-body-sm text-on-surface-variant hover:bg-surface-container-high cursor-pointer transition-colors active:scale-95">沪深300</span>
<span class="px-4 py-2 bg-surface-container-low rounded-[12px] text-body-sm text-on-surface-variant hover:bg-surface-container-high cursor-pointer transition-colors active:scale-95">医疗健康</span>
<span class="px-4 py-2 bg-surface-container-low rounded-[12px] text-body-sm font-label text-on-surface-variant hover:bg-surface-container-high cursor-pointer transition-colors active:scale-95">000001</span>
<span class="px-4 py-2 bg-surface-container-low rounded-[12px] text-body-sm text-on-surface-variant hover:bg-surface-container-high cursor-pointer transition-colors active:scale-95">低碳经济</span>
</div>
</section>
<!-- Empty State Illustration Placeholder (Remained for layout balance) -->
<div class="mt-20 flex flex-col items-center justify-center py-10 opacity-30">
<div class="w-32 h-32 bg-surface-container-high rounded-xl relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-tr from-primary/10 to-transparent"></div>
<div class="absolute -bottom-4 -right-4 w-16 h-16 bg-primary/10 rounded-full blur-xl"></div>
<div class="flex items-center justify-center h-full">
<span class="material-symbols-outlined text-4xl text-outline">search_off</span>
</div>
</div>
<p class="mt-4 text-body-sm text-outline">开始探索你的投资目标</p>
</div>
</main>
<!-- Bottom Navigation (Shared Component) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 pb-safe bg-surface-container-lowest shadow-[0_-4px_20px_0_rgba(0,0,0,0.04)] rounded-t-xl z-50">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors p-2 rounded-lg group" href="#">
<span class="material-symbols-outlined group-active:scale-90 duration-200">home</span>
<span class="text-[10px] mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-primary font-bold hover:bg-surface-container p-2 rounded-lg group" href="#">
<span class="material-symbols-outlined group-active:scale-90 duration-200" style="font-variation-settings: 'FILL' 1;">target</span>
<span class="text-[10px] mt-1">Goals</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container p-2 rounded-lg group" href="#">
<span class="material-symbols-outlined group-active:scale-90 duration-200">account_balance_wallet</span>
<span class="text-[10px] mt-1">Assets</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container p-2 rounded-lg group" href="#">
<span class="material-symbols-outlined group-active:scale-90 duration-200">person</span>
<span class="text-[10px] mt-1">Mine</span>
</a>
</nav>
<script>
        // Micro-interactions for search input
        const searchInput = document.querySelector('input');
        const searchIcon = document.querySelector('.material-symbols-outlined.absolute');
        
        searchInput.addEventListener('focus', () => {
            searchIcon.classList.add('text-primary');
            searchIcon.classList.remove('text-outline');
        });

        searchInput.addEventListener('blur', () => {
            searchIcon.classList.remove('text-primary');
            searchIcon.classList.add('text-outline');
        });

        // Asset type switcher logic
        const switcherButtons = document.querySelectorAll('.flex.overflow-x-auto button');
        switcherButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                switcherButtons.forEach(b => {
                    b.classList.remove('segmented-control-active');
                    b.classList.add('bg-surface-container-low', 'text-on-surface-variant');
                });
                btn.classList.add('segmented-control-active');
                btn.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
            });
        });

        // Simple tag selection effect
        document.querySelectorAll('.cursor-pointer').forEach(tag => {
            tag.addEventListener('click', () => {
                searchInput.value = tag.textContent;
                searchInput.focus();
            });
        });
    </script>
</body></html>
