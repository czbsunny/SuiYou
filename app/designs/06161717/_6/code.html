<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>录入持仓 - 遗产壁炉</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "surface-variant": "#e3e2e0",
                        "inverse-on-surface": "#f2f1ee",
                        "on-tertiary-container": "#fff8f2",
                        "outline": "#6f7975",
                        "on-secondary-fixed-variant": "#92001c",
                        "on-primary-container": "#e7fff5",
                        "on-primary-fixed-variant": "#005142",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#84d6be",
                        "on-secondary-container": "#fffbff",
                        "tertiary-container": "#8b6e3a",
                        "surface-container": "#efeeeb",
                        "secondary-container": "#db313f",
                        "on-primary-fixed": "#002019",
                        "background": "#faf9f6",
                        "secondary": "#b7102a",
                        "primary": "#2a806c",
                        "on-surface": "#1a1c1a",
                        "inverse-primary": "#84d6be",
                        "on-tertiary-fixed-variant": "#5b4313",
                        "inverse-surface": "#2f312f",
                        "surface-container-highest": "#e3e2e0",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "tertiary": "#705624",
                        "surface-dim": "#dbdad7",
                        "surface-bright": "#faf9f6",
                        "surface-container-high": "#e9e8e5",
                        "surface": "#faf9f6",
                        "on-background": "#1a1c1a",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#066b58",
                        "secondary-fixed-dim": "#ffb3b1",
                        "on-tertiary-fixed": "#271900",
                        "primary-container": "#2a806c",
                        "tertiary-fixed": "#ffdeaa",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#3f4945",
                        "on-secondary-fixed": "#410007",
                        "tertiary-fixed-dim": "#e6c185",
                        "outline-variant": "#bec9c4",
                        "secondary-fixed": "#ffdad8",
                        "primary-fixed": "#a0f2da",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f4f3f1",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.75rem",
                        "lg": "0.75rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["JetBrains Mono"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }
        .soft-shadow {
            box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.04);
        }
        input:focus {
            box-shadow: inset 0 0 0 1px #2a806c;
            outline: none;
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen pb-40">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-background flex items-center px-4 h-16 justify-between">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary cursor-pointer active:scale-95 transition-transform" data-icon="arrow_back">arrow_back</span>
<h1 class="font-headline text-lg font-bold text-on-surface">录入持仓</h1>
</div>

</header>
<main class="pt-2 space-y-4 px-4 max-w-2xl mx-auto">
<!-- Manual Entry Section -->
<section class="bg-white rounded-lg p-5 soft-shadow space-y-5">
<div class="flex items-center justify-between">
<h2 class="text-base font-bold flex items-center gap-2">
<span class="w-1 h-4 bg-primary rounded-full"></span>
                    手动输入
                </h2>
<!-- OCR Button styled like Screen_17 -->
<button class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-primary-fixed/30 text-on-primary-fixed-variant hover:bg-primary-fixed/50 transition-colors">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: &quot;FILL&quot; 1;">photo_camera</span>
<span class="text-xs font-semibold">图片识别持仓</span>
</button>
</div>
<div class="space-y-4">
<!-- Stock Name Trigger -->
<div>
<label class="block text-[11px] font-bold uppercase tracking-wider text-on-surface-variant/70 mb-1.5 ml-1">股票名称</label>
<button class="w-full bg-surface-container-low/60 p-3.5 rounded-lg flex justify-between items-center text-left hover:bg-surface-container transition-all active:scale-[0.99] border border-transparent hover:border-primary/10">
<div class="flex flex-col">
<span class="text-sm font-semibold text-on-surface-variant">点击搜索股票名称或代码...</span>
</div>
<span class="material-symbols-outlined text-outline text-lg">search</span>
</button>
</div>
<!-- Inputs Grid -->
<div class="grid grid-cols-2 gap-3">
<div>
<label class="block text-[11px] font-bold uppercase tracking-wider text-on-surface-variant/70 mb-1.5 ml-1">成本价</label>
<div class="relative">
<input class="w-full bg-surface-container-low/60 border-none rounded-lg p-3.5 mono-font text-sm placeholder-outline-variant" placeholder="0.00" step="0.01" type="number">
<span class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-outline mono-font">CNY</span>
</div>
</div>
<div>
<label class="block text-[11px] font-bold uppercase tracking-wider text-on-surface-variant/70 mb-1.5 ml-1">持仓股数</label>
<input class="w-full bg-surface-container-low/60 border-none rounded-lg p-3.5 mono-font text-sm placeholder-outline-variant" placeholder="100" type="number">
</div>
</div>
<!-- Holding Days -->
<div>
<label class="block text-[11px] font-bold uppercase tracking-wider text-on-surface-variant/70 mb-1.5 ml-1">持有天数 (可选)</label>
<input class="w-full bg-surface-container-low/60 border-none rounded-lg p-3.5 mono-font text-sm placeholder-outline-variant" placeholder="选填" type="number">
</div>
</div>
<!-- Add to List Button -->
<button class="w-full bg-primary text-on-primary py-3.5 rounded-full font-bold text-sm hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">add_circle</span>
                加入待添加列表
            </button>
</section>
<!-- Pending List Section -->
<section class="space-y-3 pb-8">
<div class="flex items-center justify-between px-1">
<h2 class="text-sm font-bold text-on-surface">待添加列表</h2>
<span class="bg-primary-container text-on-primary-container text-[10px] px-2 py-0.5 rounded-full font-bold mono-font">2 ITEMS</span>
</div>
<div class="space-y-3">
<!-- Stock Item 1 -->
<div class="bg-white rounded-lg p-4 soft-shadow flex justify-between items-center border border-transparent hover:border-primary/10 transition-colors">
<div class="space-y-2">
<div class="flex items-center gap-2">
<p class="font-bold text-sm">腾讯控股</p>
<span class="text-[10px] text-outline px-1.5 py-0.5 bg-surface-container rounded-md mono-font">00700.HK</span>
</div>
<div class="flex gap-8">
<div class="flex flex-col">
<span class="text-[10px] uppercase font-bold text-outline-variant">成本</span>
<span class="mono-font font-semibold text-xs">384.20</span>
</div>
<div class="flex flex-col">
<span class="text-[10px] uppercase font-bold text-outline-variant">股数</span>
<span class="mono-font font-semibold text-xs text-on-surface">500</span>
</div>
</div>
</div>
<button class="p-2.5 text-outline-variant hover:text-secondary hover:bg-secondary-fixed/30 transition-colors rounded-full">
<span class="material-symbols-outlined text-xl">delete</span>
</button>
</div>
<!-- Stock Item 2 -->
<div class="bg-white rounded-lg p-4 soft-shadow flex justify-between items-center border border-transparent hover:border-primary/10 transition-colors">
<div class="space-y-2">
<div class="flex items-center gap-2">
<p class="font-bold text-sm">招商银行</p>
<span class="text-[10px] text-outline px-1.5 py-0.5 bg-surface-container rounded-md mono-font">600036.SH</span>
</div>
<div class="flex gap-8">
<div class="flex flex-col">
<span class="text-[10px] uppercase font-bold text-outline-variant">成本</span>
<span class="mono-font font-semibold text-xs">32.15</span>
</div>
<div class="flex flex-col">
<span class="text-[10px] uppercase font-bold text-outline-variant">股数</span>
<span class="mono-font font-semibold text-xs text-on-surface">2,400</span>
</div>
</div>
</div>
<button class="p-2.5 text-outline-variant hover:text-secondary hover:bg-secondary-fixed/30 transition-colors rounded-full">
<span class="material-symbols-outlined text-xl">delete</span>
</button>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-16 left-0 w-full bg-background p-4 pb-6 soft-shadow rounded-t-xl z-40">
<button class="w-full bg-primary text-on-primary py-4 rounded-full font-bold text-sm hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
<span class="">确认录入持仓</span>
<span class="material-symbols-outlined text-xl">check_circle</span>
</button>
<p class="text-center text-[11px] text-outline mt-3">录入后资产将自动更新至您的投资组合</p>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 bg-surface-container-lowest z-50 rounded-t-xl shadow-[0_-4px_20px_0_rgba(0,0,0,0.04)]">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-transform duration-200 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="mono-font text-[10px] font-bold uppercase mt-1">首页</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-transform duration-200 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="track_changes">track_changes</span>
<span class="mono-font text-[10px] font-bold uppercase mt-1">目标</span>
</a>
<a class="flex flex-col items-center justify-center text-primary bg-primary-container/10 rounded-xl px-3 py-1 transition-transform duration-200 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="account_balance_wallet" style="font-variation-settings: &quot;FILL&quot; 1;">account_balance_wallet</span>
<span class="mono-font text-[10px] font-bold uppercase mt-1">资产</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-transform duration-200 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="mono-font text-[10px] font-bold uppercase mt-1">我的</span>
</a>
</nav>
<!-- Background Decorative Elements -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-5 overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[60%] h-[40%] bg-primary blur-[120px] rounded-full"></div>
</div>
<script>
        // Micro-interactions for inputs
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.closest('div').classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', function() {
                this.parentElement.closest('div').classList.remove('scale-[1.01]');
            });
        });
    </script>


</body></html>
