        // Subtle interaction for fund cards
        document.querySelectorAll('.holding-card').forEach(card => {
            card.addEventListener('touchstart', () => {

            card.addEventListener('touchend', () => {
                card.style.transform = 'scale(1)';
            });
        });

        // Numerical ticker animation effect (simulated)
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = (progress * (end - start) + start).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }
