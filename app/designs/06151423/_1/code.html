<!DOCTYPE html><html class="light" lang="zh-CN" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>证券账户详情 - Stewardship</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#006754",
                        "primary-container": "#2a806c",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#e7fff5",
                        "secondary": "#b7102a", // Red for profit in Chinese markets
                        "error": "#006754", // Using primary green for "loss" or negative in the red-for-profit context (often Green is loss in CN)
                        "background": "#faf9f6",
                        "surface": "#faf9f6",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f4f3f1",
                        "on-surface": "#1a1c1a",
                        "on-surface-variant": "#3f4945",
                        "outline-variant": "#bec9c4",
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "1.5rem", // 24px as specified
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["JetBrains Mono"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #faf9f6;
            color: #1a1c1a;
            -webkit-tap-highlight-color: transparent;
        }
        .profit-text { color: #b7102a; } /* Red */
        .loss-text { color: #006754; } /* Green */
    </style>
</head>
<body class="font-body selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface/80 backdrop-blur-md flex justify-between items-center px-4 py-4">
<div class="flex items-center gap-3">
<button class="hover:opacity-80 active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="text-primary font-headline font-bold text-xl">中信证券</h1>
</div>
<div class="flex items-center gap-4">
<button class="hover:opacity-80 active:scale-95 transition-all">
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
</button>
<div class="w-8 h-8 rounded-full overflow-hidden bg-outline-variant/20">
<img alt="User" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAjWqTMCmaROTPaw0bhjc_vk-950ke6sfiD1N7J33LzRMaAIzosC5GoUuiaKOLdKv7_rHnyGhE0rRl5QRtktRQ8IpjoufvQK1ExLKGaVlJs6i6I_sDeaN1ByyW3sowFB6WCpSvSHVf5a2kV0HOIeGgKXL3ffcMV1z8oCRsoWd86hosFCy2frtiJ1lRO2mBpinqDmA6PJuqZjqU-5MEioB3peHlve0wO52RGeu8tKFUuiBAh3ay7bfqdLfUHH-YcacEwOX63v1fVa-Uw">
</div>
</div>
</header>
<main class="px-4 pt-2 pb-32 space-y-6 max-w-2xl mx-auto">
<!-- Header Card: Asset Summary -->
<section class="rounded-lg p-6 shadow-lg relative overflow-hidden bg-white text-on-surface">
<div class="absolute top-0 right-0 p-4 opacity-10">

</div>
<div class="relative z-10">
<p class="text-xs font-medium opacity-80 mb-1">总资产 (CNY)</p>
<h2 class="font-label text-4xl font-bold tracking-tight mb-6">4,120,500.00</h2>
<div class="grid grid-cols-2 gap-y-6">
<div>
<p class="text-xs opacity-70 mb-1">今日盈亏</p>
<p class="font-label text-lg font-bold text-[#b7102a]">+12,400.50</p>
</div>
<div>
<p class="text-xs opacity-70 mb-1">累计盈亏</p>
<p class="font-label text-lg font-bold text-[#b7102a]">+450,210.00</p>
</div>
<div class="col-span-2 pt-2 border-t border-outline-variant/30">
<p class="text-xs opacity-70 mb-1">可用余额</p>
<p class="font-label text-xl font-bold">128,450.00</p>
</div>
</div>
</div>
</section>
<!-- Action Section -->
<section class="grid grid-cols-4 gap-4 px-2">
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 bg-surface-container-lowest shadow-sm flex items-center justify-center text-secondary group-active:scale-95 transition-transform rounded-2xl">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: &quot;FILL&quot; 1;">add_circle</span>
</div>
<span class="text-xs font-semibold text-on-surface">买入</span>
</button>
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 bg-surface-container-lowest shadow-sm flex items-center justify-center text-primary group-active:scale-95 transition-transform rounded-2xl">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: &quot;FILL&quot; 1;">do_not_disturb_on</span>
</div>
<span class="text-xs font-semibold text-on-surface">卖出</span>
</button>
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 bg-surface-container-lowest shadow-sm flex items-center justify-center text-on-surface-variant group-active:scale-95 transition-transform rounded-2xl">
<span class="material-symbols-outlined text-2xl">sync_alt</span>
</div>
<span class="text-xs font-semibold text-on-surface">转账</span>
</button>
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 bg-surface-container-lowest shadow-sm flex items-center justify-center text-on-surface-variant group-active:scale-95 transition-transform rounded-2xl">
<span class="material-symbols-outlined text-2xl">search</span>
</div>
<span class="text-xs font-semibold text-on-surface">查询</span>
</button>
</section>
<!-- Assets List -->
<section class="space-y-4">
<div class="flex justify-between items-center">
<h3 class="font-headline text-lg font-bold">持仓明细</h3>

</div>
<div class="space-y-3"><!-- Stocks Category -->
<button class="w-full flex justify-between items-center bg-white p-5 shadow-sm hover:bg-surface-container-low transition-colors rounded-2xl">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary/10 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-secondary">show_chart</span>
</div>
<span class="font-bold text-lg">股票</span>
</div>
<div class="flex items-center gap-2">
<span class="font-label font-bold text-on-surface">¥3,250,000.00</span>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
</button>
<!-- Funds Category -->
<button class="w-full flex justify-between items-center bg-white p-5 shadow-sm hover:bg-surface-container-low transition-colors rounded-2xl">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary">finance</span>
</div>
<span class="font-bold text-lg">基金</span>
</div>
<div class="flex items-center gap-2">
<span class="font-label font-bold text-on-surface">¥742,050.00</span>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
</button></div>
</section>
</main>
<!-- Bottom Navigation -->
<div class="fixed bottom-0 left-0 w-full z-50">
<nav class="bg-surface-container-lowest shadow-[0_-4px_20px_rgba(0,0,0,0.04)] rounded-t-lg px-4 py-3 pb-safe flex justify-around items-center">
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-[10px] font-bold mt-1">首页</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1">
<span class="material-symbols-outlined">track_changes</span>
<span class="font-label text-[10px] font-bold mt-1">目标</span>
</div>
<div class="flex flex-col items-center justify-center text-primary px-4 py-1">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">account_balance_wallet</span>
<span class="font-label text-[10px] font-bold mt-1">资产</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1">
<span class="material-symbols-outlined">person</span>
<span class="font-label text-[10px] font-bold mt-1">我的</span>
</div>
</nav>
</div>








</body></html>
