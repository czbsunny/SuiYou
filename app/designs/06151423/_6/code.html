<script>
        // Simple Micro-interactions for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', function() {
                this.classList.add('opacity-80');
            });
            btn.addEventListener('touchend', function() {
                this.classList.remove('opacity-80');
            });
        });

        // Price adjustment logic
        const priceInput = document.querySelector('input[value="22.10"]');
        const adjustButtons = document.querySelectorAll('button .material-symbols-outlined');
        
        adjustButtons.forEach(icon => {
            if (icon.innerText === 'add_circle_outline') {
                icon.parentElement.onclick = () => {
                    let val = parseFloat(priceInput.value);
                    priceInput.value = (val + 0.01).toFixed(2);
                };
            } else if (icon.innerText === 'remove_circle_outline') {
                icon.parentElement.onclick = () => {
                    let val = parseFloat(priceInput.value);
                    if (val > 0.01) priceInput.value = (val - 0.01).toFixed(2);
                };
            }
        });
    </script>
