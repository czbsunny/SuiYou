<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>银证转账 - Heritage Hearth</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#efeeeb",
                        "on-error": "#ffffff",
                        "tertiary": "#705624",
                        "on-background": "#1a1c1a",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#ffb3b1",
                        "tertiary-fixed-dim": "#e6c185",
                        "inverse-on-surface": "#f2f1ee",
                        "primary-fixed-dim": "#84d6be",
                        "outline-variant": "#bec9c4",
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#fffbff",
                        "surface-container-highest": "#e3e2e0",
                        "surface-tint": "#066b58",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#faf9f6",
                        "on-primary-fixed-variant": "#005142",
                        "surface-dim": "#dbdad7",
                        "tertiary-container": "#8b6e3a",
                        "surface": "#faf9f6",
                        "on-surface": "#1a1c1a",
                        "surface-container-high": "#e9e8e5",
                        "tertiary-fixed": "#ffdeaa",
                        "error": "#ba1a1a",
                        "secondary-container": "#db313f",
                        "on-tertiary-fixed": "#271900",
                        "inverse-primary": "#84d6be",
                        "primary-container": "#2a806c",
                        "outline": "#6f7975",
                        "on-tertiary-container": "#fff8f2",
                        "secondary": "#b7102a",
                        "primary-fixed": "#a0f2da",
                        "background": "#faf9f6",
                        "secondary-fixed": "#ffdad8",
                        "on-primary-container": "#e7fff5",
                        "primary": "#2a806c",
                        "on-tertiary-fixed-variant": "#5b4313",
                        "on-primary-fixed": "#002019",
                        "surface-variant": "#e3e2e0",
                        "surface-container-low": "#f4f3f1",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#410007",
                        "on-surface-variant": "#3f4945",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#92001c",
                        "inverse-surface": "#2f312f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.75rem",
                        "lg": "1.5rem",
                        "xl": "2.25rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["JetBrains Mono"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #faf9f6;
            color: #1a1c1a;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .card-shadow {
            box-shadow: 0 4px 20px rgba(26, 28, 26, 0.04);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen font-body bg-surface">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface flex items-center px-5 h-16 w-full justify-between">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary cursor-pointer active:opacity-70 transition-opacity" data-icon="arrow_back">arrow_back</span>
<h1 class="font-headline text-headline-md font-semibold text-on-surface">转账</h1>
</div>
<div class="flex items-center">
<span class="font-headline text-title-sm font-bold text-primary">交易记录</span>
</div>
</header>
<main class="flex-grow px-5 pt-4 pb-24 max-w-md mx-auto w-full">
<!-- Sliding Segmented Picker -->
<div class="bg-surface-container-high rounded-full p-1.5 flex relative mb-8">
<div class="absolute top-1.5 bottom-1.5 left-1.5 w-[calc(50%-6px)] bg-surface-container-lowest rounded-full shadow-sm transition-all duration-300 ease-out" id="segment-indicator"></div>
<button class="relative z-10 flex-1 py-2 text-label-caps font-bold text-primary transition-colors duration-300" id="btn-in" onclick="switchSegment(0)">转入证券</button>
<button class="relative z-10 flex-1 py-2 text-label-caps font-bold text-on-surface-variant transition-colors duration-300" id="btn-out" onclick="switchSegment(1)">转出证券</button>
</div>
<!-- Flow Visualizer -->
<div class="flex items-center justify-between px-6 mb-8">
<div class="flex flex-col items-center gap-2">
<div class="w-14 h-14 rounded-full bg-surface-container-lowest border border-outline-variant flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="account_balance">account_balance</span>
</div>
<span class="text-body-sm font-semibold opacity-60" id="source-label">银行账户</span>
</div>
<div class="flex-grow flex items-center justify-center relative">
<div class="w-full h-[1px] bg-outline-variant absolute"></div>
<div class="z-10 bg-surface px-2">
<span class="material-symbols-outlined text-primary transition-transform duration-300" data-icon="trending_flat">trending_flat</span>
</div>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-14 h-14 rounded-full bg-primary flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-on-primary text-2xl" data-icon="show_chart">show_chart</span>
</div>
<span class="text-body-sm font-semibold text-primary" id="dest-label">证券账户</span>
</div>
</div>
<!-- Bank Card Selector -->
<section class="bg-surface-container-lowest rounded-[0.75rem] p-5 mb-6 card-shadow border border-surface-container">
<div class="flex justify-between items-center mb-4">
<h3 class="text-label-caps text-on-surface-variant">选择银行卡</h3>
<span class="text-primary text-body-sm font-bold">更换</span>
</div>
<div class="flex items-center gap-4">
<img alt="Bank Logo" class="w-10 h-10 rounded-lg object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD74U2PvvRH9Ms7Gy-SQLdtjlGtLo1wcaqLaD1Rc9nA4xT6k2zW18UOj1FZh-LLrVRKn51aZcu7kEwvCB8HpjesVJgCKQ4pGijXiI_H6qNmE28HEf4m3kzfpCXjOrmfan5lAkurS9BzfZRt-ziqXznOq6Hrj-acbCQQY_FgxVkAIx5cgOpFtu9t8qtrtZ03OA94N9dXDqBD35u3CAQ0yr-BUZVA3y-XUDF6-WbQDUlT1LMRFQP-s_JPgffYiUnaWzr0H8E8sSw2rMea"/>
<div class="flex flex-col">
<span class="text-title-sm font-semibold text-on-surface">招商银行</span>
<span class="text-body-sm font-label text-on-surface-variant">尾号 8892</span>
</div>
<span class="material-symbols-outlined ml-auto text-outline" data-icon="chevron_right">chevron_right</span>
</div>
</section>
<!-- Amount Input Section -->
<section class="bg-surface-container-lowest rounded-[0.75rem] p-5 mb-8 card-shadow border border-surface-container">
<div class="flex justify-between items-center mb-6">
<h3 class="text-label-caps text-on-surface-variant">转账金额</h3>
<div class="flex items-center gap-1">
<span class="text-body-sm text-on-surface-variant">可转金额</span>
<span class="text-body-sm font-label font-semibold text-primary">¥2,480,000.00</span>
</div>
</div>
<div class="flex items-end gap-3 pb-2 border-b border-surface-container-high focus-within:border-primary transition-colors">
<span class="text-display-lg font-bold text-on-surface">¥</span>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 text-display-lg font-label placeholder:text-surface-variant text-on-surface" placeholder="0.00" type="number"/>
<button class="text-primary font-bold text-body-sm whitespace-nowrap mb-2 active:opacity-70">全部转入</button>
</div>
</section>
<!-- CTA Action -->
<button class="w-full bg-primary text-on-primary py-4 rounded-full text-title-sm font-bold shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform duration-200">
        确认转入
    </button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-3 bg-surface-container-lowest shadow-[0_-4px_20px_rgba(26,28,26,0.04)] rounded-t-xl">
<div class="flex flex-col items-center justify-center text-on-surface-variant cursor-pointer hover:text-primary transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="add_chart">add_chart</span>
<span class="font-label text-[10px] mt-1">买入</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant cursor-pointer hover:text-primary transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="sell">sell</span>
<span class="font-label text-[10px] mt-1">卖出</span>
</div>
<div class="flex flex-col items-center justify-center text-primary font-bold cursor-pointer transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="swap_horiz" style="font-variation-settings: 'FILL' 1;">swap_horiz</span>
<span class="font-label text-[10px] mt-1">转账</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant cursor-pointer hover:text-primary transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="history_edu">history_edu</span>
<span class="font-label text-[10px] mt-1">查询</span>
</div>
</nav>
<script>
    function switchSegment(index) {
        const indicator = document.getElementById('segment-indicator');
        const btnIn = document.getElementById('btn-in');
        const btnOut = document.getElementById('btn-out');
        const sourceLabel = document.getElementById('source-label');
        const destLabel = document.getElementById('dest-label');
        const ctaBtn = document.querySelector('button.bg-primary');
        const arrowIcon = document.querySelector('[data-icon="trending_flat"]');

        if (index === 0) {
            indicator.style.transform = 'translateX(0)';
            btnIn.classList.add('text-primary');
            btnIn.classList.remove('text-on-surface-variant');
            btnOut.classList.add('text-on-surface-variant');
            btnOut.classList.remove('text-primary');
            
            sourceLabel.innerText = '银行账户';
            destLabel.innerText = '证券账户';
            ctaBtn.innerText = '确认转入';
            arrowIcon.style.transform = 'rotate(0deg)';
        } else {
            indicator.style.transform = 'translateX(calc(100% + 6px))';
            btnOut.classList.add('text-primary');
            btnOut.classList.remove('text-on-surface-variant');
            btnIn.classList.add('text-on-surface-variant');
            btnIn.classList.remove('text-primary');

            sourceLabel.innerText = '证券账户';
            destLabel.innerText = '银行账户';
            ctaBtn.innerText = '确认转出';
            arrowIcon.style.transform = 'rotate(180deg)';
        }
    }
</script>
</body></html>
